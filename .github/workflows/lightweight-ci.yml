name: Lightweight Baseline CI

on:
  push:
    branches:
      - develop/lightweight-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Build pinned compatibility frontend
        uses: ./.github/actions/build-frontend
        with:
          ref: 3324844cfa347f18c83435f1ccf5634df7e5b768

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Verify removed control surfaces
        run: bash scripts/ci/removed-control-surfaces.sh

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Linux amd64 binary
        env:
          CC: musl-gcc
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags="-s -w -linkmode external -extldflags=-static -X github.com/komari-monitor/komari/utils.ForkVersion=0.1.0 -X github.com/komari-monitor/komari/utils.Edition=lightweight-ci -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}" \
            -o komari-linux-amd64 .
          if readelf --program-headers komari-linux-amd64 | grep --quiet INTERP; then
            echo "binary unexpectedly contains a dynamic interpreter"
            exit 1
          fi
          ./komari-linux-amd64 --help

      - name: Build Docker image
        run: |
          docker build \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --tag komari-lightweight:m0 .

      - name: Verify container command
        run: docker run --rm komari-lightweight:m0 /app/komari --help

      - name: Checkout pinned official Agent
        uses: actions/checkout@v5
        with:
          repository: komari-monitor/komari-agent
          ref: c7bafb79b1a73ed9e14e2c248ae4d4163e506036
          path: .ci/komari-agent
          persist-credentials: false

      - name: Build pinned official Agent
        working-directory: .ci/komari-agent
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o ../../komari-agent-linux-amd64 .

      - name: Verify Agent V2 and Docker persistence
        env:
          KOMARI_AGENT_BINARY: ${{ github.workspace }}/komari-agent-linux-amd64
        run: bash scripts/ci/m0-integration.sh
